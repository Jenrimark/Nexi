<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nexi Graph</title>
  <script src="echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d14; }
    #chart { width: 100%; height: 100%; }
    #empty {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      color: #555577; font-family: system-ui, sans-serif; font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <div id="empty">暂无节点，录入第一条笔记开始构建图谱</div>
  <script>
    var chart = null;
    var highlightId = null;

    function initChart() {
      var el = document.getElementById('chart');
      chart = echarts.init(el, null, { renderer: 'canvas' });
      chart.on('click', function (params) {
        if (params.dataType === 'node' && window.NexiBridge && window.NexiBridge.onNodeClick) {
          window.NexiBridge.onNodeClick(String(params.data.id));
        }
      });
      window.addEventListener('resize', function () { chart && chart.resize(); });
    }

    function truncate(text, max) {
      if (!text) return '';
      return text.length > max ? text.slice(0, max) + '…' : text;
    }

    function setGraphData(jsonStr) {
      if (!chart) initChart();
      var data = JSON.parse(jsonStr);
      var emptyEl = document.getElementById('empty');
      if (!data.nodes || data.nodes.length === 0) {
        chart.clear();
        emptyEl.style.display = 'flex';
        return;
      }
      emptyEl.style.display = 'none';

      var nodes = data.nodes.map(function (n) {
        var isNew = highlightId && String(n.id) === String(highlightId);
        return {
          id: String(n.id),
          name: truncate(n.content, 10),
          symbolSize: isNew ? 36 : 28,
          value: n.content,
          itemStyle: {
            color: isNew ? '#00cec9' : '#6c5ce7',
            borderColor: isNew ? '#55efc4' : '#a29bfe',
            borderWidth: isNew ? 2 : 1,
            shadowBlur: isNew ? 20 : 10,
            shadowColor: isNew ? 'rgba(0,206,201,0.6)' : 'rgba(108,92,231,0.5)'
          }
        };
      });

      var links = (data.edges || []).map(function (e) {
        return {
          source: String(e.source),
          target: String(e.target),
          value: e.similarity,
          lineStyle: {
            color: '#00cec9',
            opacity: 0.35 + (e.similarity || 0) * 0.4,
            width: Math.max(1, (e.similarity || 0.5) * 3),
            curveness: 0.15
          }
        };
      });

      chart.setOption({
        backgroundColor: 'transparent',
        animationDurationUpdate: 800,
        animationEasingUpdate: 'quinticInOut',
        series: [{
          type: 'graph',
          layout: 'force',
          data: nodes,
          links: links,
          roam: true,
          draggable: true,
          scaleLimit: { min: 0.3, max: 3 },
          force: {
            repulsion: 180,
            edgeLength: [60, 140],
            gravity: 0.06,
            friction: 0.6
          },
          label: {
            show: true,
            position: 'bottom',
            color: '#c8c8e8',
            fontSize: 10,
            distance: 4
          },
          emphasis: {
            focus: 'adjacency',
            lineStyle: { width: 4, opacity: 0.9 },
            itemStyle: { shadowBlur: 24, shadowColor: 'rgba(0,206,201,0.8)' }
          }
        }]
      }, true);
    }

    function highlightNode(nodeId) {
      highlightId = nodeId;
    }

    initChart();
  </script>
</body>
</html>
