name: HarmonyOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# HarmonyOS SDK 6.0.2 命令行工具（与 DevEco 6.0.2.642 对齐）
env:
  COMMANDLINE_TOOL_DIR: /opt/harmonyos-tools
  OHOS_BASE_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
  HOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ohpm dependencies
        run: ohpm install --all

      - name: Lint
        run: |
          hvigorw --version
          hvigorw lint \
            --mode module \
            -p product=default \
            --no-daemon \
            --stacktrace

      - name: Build HAP
        run: |
          hvigorw clean assembleHap \
            --mode module \
            -p product=default \
            --no-daemon \
            --stacktrace

      - name: Run tests
        run: |
          hvigorw test \
            --mode module \
            -p product=default \
            --no-daemon \
            --stacktrace

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hap-output
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 7
